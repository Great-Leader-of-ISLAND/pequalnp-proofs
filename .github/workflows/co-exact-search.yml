name: Co circuit shard search
on:
  push:
    branches: [co-first13-20261124-0257]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Fetch the research program and certificate checker
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          cd "$RUNNER_TEMP"
          apt-get download cadical
          dpkg-deb -x cadical_*.deb solver
          "$RUNNER_TEMP/solver/usr/bin/cadical" --version
          git init -q drat
          git -C drat fetch -q --depth 1 https://github.com/marijnheule/drat-trim.git 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          git -C drat checkout -q --detach FETCH_HEAD
          cc -O2 -DNDEBUG drat/drat-trim.c -o "$RUNNER_TEMP/drat-check"
      - name: Verify the position condition against full positive and negative controls
        run: |
          set -eu
          for pos in 13; do
            for extra in '' --bad-position; do
              python3 research/search13.py --position "$pos" --cadical "$RUNNER_TEMP/solver/usr/bin/cadical" --control research/graph1342-control22.json --timeout 8 $extra
            done
          done
      - name: Search entire assigned position for 3600 seconds and independently check any DRAT certificate
        run: bash research/run-position13.sh 13
