name: Co single-star formula search
on:
  push:
    branches: [co-star13-20261124-0317]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Fetch the research program and certificate checker
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          cd "$RUNNER_TEMP"
          apt-get download cadical
          dpkg-deb -x cadical_*.deb solver
          "$RUNNER_TEMP/solver/usr/bin/cadical" --version
          git init -q drat
          git -C drat fetch -q --depth 1 https://github.com/marijnheule/drat-trim.git 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          git -C drat checkout -q --detach FETCH_HEAD
          cc -O2 -DNDEBUG drat/drat-trim.c -o "$RUNNER_TEMP/drat-check"
      - name: Check the finite coloring restrictions and run the selected trees sequentially
        run: |
          set -euo pipefail
          curl --retry 2 --max-time 20 -fsSL https://data.pequalnp.com/data/desk/gaps.json -o "$RUNNER_TEMP/desk.json"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));g=next(g for g in d['gaps'] if g['id']=='L-meta-1343');assert 'FIRSTJ=13)' in g['shard_spec'].splitlines()[13]" "$RUNNER_TEMP/desk.json"
          python3 research/graph1343-shard13-cuts.py
          sha256sum research/graph1343-shard13-{cuts,formula}.py research/run_shapes.py
          python3 research/run_shapes.py "$RUNNER_TEMP/solver/usr/bin/cadical" "$RUNNER_TEMP/drat-check"
