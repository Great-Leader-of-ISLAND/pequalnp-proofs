name: Petersen-minus-one exact synthesis
on:
  push:
    branches: [co-petersen-670-20261124]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 31
    steps:
      - name: Fetch the research program and certificate checker
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          cd "$RUNNER_TEMP"
          apt-get download cadical
          dpkg-deb -x cadical_*.deb solver
          "$RUNNER_TEMP/solver/usr/bin/cadical" --version
          git init -q drat
          git -C drat fetch -q --depth 1 https://github.com/marijnheule/drat-trim.git 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          git -C drat checkout -q --detach FETCH_HEAD
          cc -O2 -DNDEBUG drat/drat-trim.c -o "$RUNNER_TEMP/drat-check"
      - name: Verify live ledger and run both positive controls
        run: |
          curl --retry 2 -fsSL https://data.pequalnp.com/data/desk/gaps.json > "$RUNNER_TEMP/ledger.json"
          python3 - "$RUNNER_TEMP/ledger.json" <<'PYCODE'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert any(g['id']=='L-meta-670' for g in d['gaps'])
          assert not any(g['id']=='L-meta-670' for g in d['checked'])
          PYCODE
          sha256sum research/petersen670.py research/petersen670-window.py
          python3 research/petersen670.py --self-test
      - name: Try size-reducing rewrites including NOT
        run: |
          python3 research/petersen670-window.py --seconds 70 --tests 1000000000 --seed 6702511 --witness "$RUNNER_TEMP/window.json"
      - name: Search all first-gate types with counterexample refinement
        run: |
          set -eu
          if test -f "$RUNNER_TEMP/window.json"; then cat "$RUNNER_TEMP/window.json"; exit 0; fi
          d="$RUNNER_TEMP/petersen"
          python3 research/petersen670.py --mode normal --seed frontier --cadical "$RUNNER_TEMP/solver/usr/bin/cadical" --checker "$RUNNER_TEMP/drat-check" --timeout 960 --directory "$d"
          if test -f "$d/witness.json"; then cat "$d/witness.json"; fi
          if test -f "$d/final.drat"; then sha256sum "$d/final.drat"; fi
          if test -f "$d/proof-check.log"; then tail -8 "$d/proof-check.log"; fi
          sha256sum "$d/current.cnf"
          cat "$d/rows.json"
