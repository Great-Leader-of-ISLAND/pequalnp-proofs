name: Theta normalization, four-ray transfer and unrestricted live search
on:
  push:
    branches: [co-theta1924-core-0857]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Fetch only the public mathematical sources
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Verify free-sign normalization and the endpoint obstruction in Lean 4.36
        run: |
          set -euo pipefail
          curl -fsSL --max-time 90 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.36.0
          cp research/CoThetaFreeCore.lean "$RUNNER_TEMP/Core.lean"
          echo '#print axioms CoThetaFreeCore.normalize_binary' >> "$RUNNER_TEMP/Core.lean"
          echo '#print axioms CoThetaFreeCore.normalize_unary' >> "$RUNNER_TEMP/Core.lean"
          lean +leanprover/lean4:v4.36.0 "$RUNNER_TEMP/Core.lean"
          cp research/CoThetaTransfer.lean "$RUNNER_TEMP/Transfer.lean"
          echo '#print axioms CoThetaTransfer.no_second_scalar' >> "$RUNNER_TEMP/Transfer.lean"
          lean +leanprover/lean4:v4.36.0 "$RUNNER_TEMP/Transfer.lean"
      - name: Exhaust live signals using only row separation and liveness
        if: always() && !cancelled()
        working-directory: research
        run: |
          set -euo pipefail
          python3 -B theta1924free.py --control
          python3 -B theta1924live.py --size 10 --no-leaf-check --memo 700000 --seconds 420
