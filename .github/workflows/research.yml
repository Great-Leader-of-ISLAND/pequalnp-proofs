name: Theta kernel benchmark for the free signed frontier
on:
  push:
    branches: [co-theta1924-kernel-0901]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Fetch only the public mathematical sources
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Run one exact ten-gate kernel calculation with Lean 4.36
        run: |
          set -euo pipefail
          curl -fsSL --max-time 90 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.36.0
          cp research/CoThetaFreeSearch.lean "$RUNNER_TEMP/Test.lean"
          echo 'open CoThetaFreeSearch' >> "$RUNNER_TEMP/Test.lean"
          echo 'set_option maxRecDepth 50000' >> "$RUNNER_TEMP/Test.lean"
          echo 'set_option maxHeartbeats 0' >> "$RUNNER_TEMP/Test.lean"
          echo 'theorem baseSeven : search 7 raw = false := by decide +kernel' >> "$RUNNER_TEMP/Test.lean"
          echo '#print axioms baseSeven' >> "$RUNNER_TEMP/Test.lean"
          echo 'theorem oneTenBranch : firstOp 10 3 5 0 = false := by decide +kernel' >> "$RUNNER_TEMP/Test.lean"
          echo '#print axioms oneTenBranch' >> "$RUNNER_TEMP/Test.lean"
          timeout -k 5s 330s lean +leanprover/lean4:v4.36.0 "$RUNNER_TEMP/Test.lean"
      - name: Cross-check the full compiled finite computation
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cp research/CoThetaFreeSearch.lean "$RUNNER_TEMP/Run.lean"
          echo 'def main : IO Unit := IO.println (CoThetaFreeSearch.search 10 CoThetaFreeSearch.raw)' >> "$RUNNER_TEMP/Run.lean"
          timeout -k 5s 330s lean +leanprover/lean4:v4.36.0 --run "$RUNNER_TEMP/Run.lean"
