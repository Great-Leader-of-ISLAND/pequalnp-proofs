name: Petersen first edge OR exact search
on:
  push:
    branches: [co-petersen651-library-0523]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Fetch the research program and certificate checker
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          cd "$RUNNER_TEMP"
          apt-get download cadical
          dpkg-deb -x cadical_*.deb solver
          "$RUNNER_TEMP/solver/usr/bin/cadical" --version
          git init -q drat
          git -C drat fetch -q --depth 1 https://github.com/marijnheule/drat-trim.git 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          git -C drat checkout -q --detach FETCH_HEAD
          cc -O2 -DNDEBUG drat/drat-trim.c -o "$RUNNER_TEMP/drat-check"
      - name: Validate first edge OR and run exact search
        run: |
          set -eu
          cd research
          curl -fsS --max-time 20 https://data.pequalnp.com/data/desk/gaps.json -o "$RUNNER_TEMP/desk.json"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));assert any(g['id']=='L-meta-651' for g in d['gaps'])" "$RUNNER_TEMP/desk.json"
          python3 -B petersen651-library.py check --budget 21
          python3 -B petersen651-library.py generate "$RUNNER_TEMP/library.cnf" --budget 19
          result=0
          "$RUNNER_TEMP/solver/usr/bin/cadical" -q -t 240 "$RUNNER_TEMP/library.cnf" "$RUNNER_TEMP/library.drat" > "$RUNNER_TEMP/model" || result=$?
          grep '^s ' "$RUNNER_TEMP/model" || true
          case "$result" in
            10) python3 -B petersen651-library.py decode "$RUNNER_TEMP/model" --budget 19 ;;
            20) "$RUNNER_TEMP/drat-check" "$RUNNER_TEMP/library.cnf" "$RUNNER_TEMP/library.drat" > "$RUNNER_TEMP/check"; tr -d '\r' < "$RUNNER_TEMP/check" | grep -Fx 's VERIFIED'; sha256sum "$RUNNER_TEMP/library.cnf" "$RUNNER_TEMP/library.drat" ;;
            0) echo 'UNKNOWN in this finite construction library' ;;
            *) exit "$result" ;;
          esac
