name: Verify reflected circuit exclusion and graph trace lemmas
on:
  push:
    branches: ['co-p2-reflected-graph-2243']
permissions: {}
jobs:
  lean:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.fork == true && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      LEAN_NUM_THREADS: '2'
      BASE: 'a6de385f7201fb6a17a50d5656ae98b787cc7387'
      CANDIDATE_BRANCH: 'L-meta-4358-reflected-v1'
      GAP: 'L-meta-4358'
      FILE: 'lean/PEqualNP/Outside/L_meta_4358.lean'
    steps:
      - name: Check out the pinned public upstream base and snapshot its public desk statement
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --no-tags --depth=1 'https://github.com/open-goat/pequalnp-proofs.git' "$BASE"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASE"
          mkdir -p "$RUNNER_TEMP/in"
          curl -fsS --retry 2 --max-time 45 --max-filesize 33554432 -o "$RUNNER_TEMP/in/gaps.json" https://data.pequalnp.com/data/desk/gaps.json
          node .github/scripts/outside-guard.mjs gap "$RUNNER_TEMP/in/gaps.json" "$GAP" "$FILE" "$RUNNER_TEMP/in" check
          echo '2328cb63c3d7bd819d8920cbcc27954f8d4448656f3aea2e8978e25c3cf9d8cf  '"$RUNNER_TEMP/in/statement.txt" | sha256sum -c -
          echo '086c15d1b559b2a2d009b0769f0c99c6115b689366849c1f05591d4b44c7abc1  '"$RUNNER_TEMP/in/imports.json" | sha256sum -c -
          node .github/scripts/outside-guard.mjs closure "$PWD" "$RUNNER_TEMP/in/imports.json" "$FILE" "$RUNNER_TEMP/in" check
      - name: Install pinned Lean and prepare Mathlib, definitions and the checker
        working-directory: lean
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 90 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake exe cache get Mathlib
          targets=(checklemma +PEqualNP.Defs)
          while IFS= read -r m; do if [[ -n "$m" ]]; then targets+=("+$m"); fi; done < "$RUNNER_TEMP/in/base-imports.txt"
          lake build "${targets[@]}"
      - name: Wait for the candidate then read exactly one new file on the expected parent
        run: |
          set -euo pipefail
          fork='https://github.com/Great-Leader-of-ISLAND/pequalnp-proofs.git'
          ref="refs/heads/$CANDIDATE_BRANCH"
          deadline=$((SECONDS + 60 * 18))
          while :; do
            if result=$(timeout 15s git ls-remote --exit-code "$fork" "$ref"); then break; fi
            if (( SECONDS >= deadline )); then echo 'Candidate unavailable within time limit'; exit 1; fi
            sleep 10
          done
          read -r sha actual <<< "$result"
          [[ "$actual" = "$ref" && "$sha" =~ ^[0-9a-f]{40}$ ]]
          test "$sha" = "083ff758d737117bf3503ca0f7d583b5830eefc4"
          git fetch -q --no-tags --depth=2 "$fork" "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          test "$(git show -s --format=%P "$sha")" = "$BASE"
          printf 'A\0%s\0' "$FILE" > "$RUNNER_TEMP/expected"
          git diff-tree --no-commit-id -r --no-renames --name-status -z "$BASE" "$sha" > "$RUNNER_TEMP/actual"
          cmp "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test "$(git ls-tree "$sha" -- "$FILE" | cut -d' ' -f1,2)" = "100644 blob"
          test "$(git cat-file -s "$sha:$FILE")" -le 524288
          test ! -e "$FILE" && test ! -L "$FILE"
          git cat-file blob "$sha:$FILE" > "$FILE"
          node .github/scripts/outside-guard.mjs imports "$FILE" "$RUNNER_TEMP/in/imports.json" "$FILE" check
          echo "Verifying $sha against upstream parent $BASE"
      - name: Compile and audit against the posted statement with the upstream verifier
        timeout-minutes: 48
        run: |
          set -euo pipefail
          # No runner credential is passed to Lean. The candidate is the only added source.
          # This fork result is advisory. The desk runs its own authoritative check.
          mkdir -p "$RUNNER_TEMP/co-queue"
          threads=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          # checklemma may need swap when all of Mathlib is imported. Use only space
          # on this disposable VM, preserving at least 6 GiB for later build output.
          disk=$(df -Pm / /mnt 2>/dev/null | awk 'NR>1 {print $4,$6}' | sort -nr | head -1)
          read -r free mount <<< "$disk"
          mb=$((free - 6144))
          if (( mb > 12288 )); then mb=12288; fi
          if (( mb >= 1024 )); then
            swap="${mount%/}/co-verifier-swap"
            sudo install -m 0600 /dev/null "$swap"
            sudo fallocate -l "${mb}M" "$swap"
            sudo mkswap -q "$swap" && sudo swapon "$swap"
          fi
          mem=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
          old=$((mem - 1572864)); if (( old > 6815744 )); then old=6815744; fi
          cap=$((mem - 3145728)); if (( cap < old )); then cap=$old; fi
          deps=$(awk 'NF{n++} END{print n+0}' "$RUNNER_TEMP/in/outside-imports.txt")
          limit=$((1200 + 240 * deps)); if (( limit > 2700 )); then limit=2700; fi
          sudo systemd-run --quiet --scope --collect -p "MemoryMax=${cap}K" unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs \
            env -i HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 PEQUALNP_HOME="$RUNNER_TEMP/co-queue" \
            taskset -c "$threads" timeout --kill-after=15s "$limit" /usr/bin/time -f "cold_seconds=%e rss_kib=%M" node tools/check-lean.mjs "$FILE" "$RUNNER_TEMP/in/statement.txt" check
      - name: Read the independent public research modules at the exact fork commit
        if: always()
        run: |
          git init -q "$RUNNER_TEMP/related"
          git -C "$RUNNER_TEMP/related" fetch -q --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/related" checkout -q --detach FETCH_HEAD
          cp "$RUNNER_TEMP"/related/research/Co*.lean lean/PEqualNP/
      - name: Classify complete two-gate repairs of eight incidence controls
        if: always()
        timeout-minutes: 7
        run: |
          cd "$RUNNER_TEMP/related/research"
          for v in 0 1 2 3 4 5 6 7; do
            timeout -k 3s 48s python3 1481-repair-pin.py "$v"
          done
      - name: Export both complete junction archives and their terminal certificates
        if: always()
        timeout-minutes: 7
        run: |
          cd "$RUNNER_TEMP/related/research"
          c++ -O3 -std=c++17 4482-junction-export.cpp -o "$RUNNER_TEMP/export"
          for k in 0 1; do
            prefix="$RUNNER_TEMP/g$k"
            "$RUNNER_TEMP/export" "$k" "$prefix.tsv"
            python3 4482-junction-audit.py "$prefix.tsv.graph" --binary "$prefix.bin" --sample "$prefix.json" --sample-count 8
            python3 4482-junction-fixed.py "$prefix.bin" "$GITHUB_WORKSPACE/lean/PEqualNP/CoJunctionArchive$k.lean"
            python3 4482-junction-stream.py "$prefix.json" "$GITHUB_WORKSPACE/lean/PEqualNP/CoStreamReal$k.lean" --count 2
            count=2713
            if [[ "$k" = 1 ]]; then count=9445; fi
            python3 4482-share-table.py "$prefix.tsv" "$prefix.groups.json" --count "$count" --orbit --seconds 20 --max-checks 5000
            python3 4482-leaf-pack.py "$prefix.tsv" "$prefix.groups.json" "$prefix.leaves"
          done
      - name: Verify Co5326Transversal
        if: always()
        working-directory: lean
        timeout-minutes: 6
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 300 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co5326Transversal"
      - name: Verify Co5326Neighborhood
        if: always()
        working-directory: lean
        timeout-minutes: 6
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 300 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co5326Neighborhood"
      - name: Verify CoAlarmMonomial1481
        if: always()
        working-directory: lean
        timeout-minutes: 6
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 300 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoAlarmMonomial1481"
      - name: Verify CoAlarmCost1481
        if: always()
        working-directory: lean
        timeout-minutes: 6
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 300 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoAlarmCost1481"
      - name: Verify CoAlarmNamed1481
        if: always()
        working-directory: lean
        timeout-minutes: 6
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 300 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoAlarmNamed1481"
      - name: Verify CoJunctionFixedModel4482
        if: always()
        working-directory: lean
        timeout-minutes: 6
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 300 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoJunctionFixedModel4482"
