name: Kernel check of circuit restriction and exact gate count
on:
  push:
    branches: [co-readers1667-0618]
permissions:
  contents: read
jobs:
  lean:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Fetch this exact public commit
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q project
          git -C project fetch -q --depth=1 --no-tags https://github.com/brilliant-hq/pequalnp-proofs.git 033116c09946d50e0e3883ee24915ea88b37d7b7
          git -C project checkout -q --detach FETCH_HEAD
          cp research/CoPetersenRestrictReaders.lean project/lean/PEqualNP/CoPetersenRestrictReaders.lean
          cp research/CoPetersenRestrictScan.lean project/lean/PEqualNP/CoPetersenRestrictScan.lean
          cp research/CoPetersenRestrict.lean project/lean/PEqualNP/CoPetersenRestrict.lean
      - name: Install pinned Lean
        working-directory: project/lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
      - name: Build the research file with the pinned Mathlib
        working-directory: project/lean
        run: |
          lake exe cache get Mathlib
          lake build +PEqualNP.CoPetersenRestrictReaders
          printf '%s\n' 'import PEqualNP.CoPetersenRestrictReaders' '#print axioms PEqualNP.Research.PetersenRestrict.scan_direct' '#print axioms PEqualNP.Research.PetersenRestrict.charge_reuses' '#print axioms PEqualNP.Research.PetersenRestrict.specialize' '#print axioms PEqualNP.Research.PetersenRestrict.charge' '#print axioms PEqualNP.Research.PetersenRestrict.simplify_val' '#print axioms PEqualNP.Research.PetersenRestrict.simplify_legal' '#print axioms PEqualNP.Research.PetersenRestrict.simplify_fixed' > "$RUNNER_TEMP/Audit.lean"
          lake env lean "$RUNNER_TEMP/Audit.lean"
