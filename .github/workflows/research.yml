name: Kernel replay of the three signed theta orbits
on:
  push:
    branches: [co-theta-modular-1000]
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Fetch the mathematical sources and prepare the exact signed trace
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q project
          git -C project fetch -q --depth=1 --no-tags https://github.com/brilliant-hq/pequalnp-proofs.git cc7575339c58a3f0e2e855a13128e39ba904a1fc
          git -C project checkout -q --detach FETCH_HEAD
          cp research/CoTheta*.lean project/lean/PEqualNP/
          python3 research/theta-witness-dag.py --expand-tree --signatures research/CoThetaWholeBase.lean --output "$RUNNER_TEMP/table.json" --seconds 150
          python3 research/render-theta-whole.py "$RUNNER_TEMP/table.json" research/CoThetaWholeBase.lean "$RUNNER_TEMP/Whole.lean" --block 8
          python3 research/split-theta-packed.py "$RUNNER_TEMP/Whole.lean" project/lean/PEqualNP --spans 16
      - name: Install the project's precise Lean release
        working-directory: project/lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake exe cache get Mathlib
      - name: Check semantic bridge and table definitions
        working-directory: project/lean
        run: |
          lake build +PEqualNP.CoThetaWholeOrbit +PEqualNP.CoThetaPackedData
          printf '%s\n' 'import PEqualNP.CoThetaWholeOrbit' '#print axioms CoThetaWholeBase.nodeTest_sound' '#print axioms CoThetaWholeBase.all_heads_from' > "$RUNNER_TEMP/Audit.lean"
          lake env lean "$RUNNER_TEMP/Audit.lean"
      - name: Diagnose every state's executable truth value
        working-directory: project/lean
        run: |
          lake env lean --run PEqualNP/CoThetaPackedDiagnostic.lean
      - name: Check single-kernel groups in series
        working-directory: project/lean
        run: |
          for file in PEqualNP/CoThetaBlock*.lean; do
            pkg=${file%.lean}
            name=${pkg/\//.}
            echo "$name"
            lake build "+$name" > "$RUNNER_TEMP/block.log" 2>&1 || { tail -40 "$RUNNER_TEMP/block.log"; exit 1; }
            rg 'Built PEqualNP.CoThetaBlock' "$RUNNER_TEMP/block.log" || true
          done
      - name: Combine all kernel judgments and check the allowed axioms
        working-directory: project/lean
        run: |
          lake build +PEqualNP.CoThetaSignedPhysical
          printf '%s\n' 'import PEqualNP.CoThetaSignedPhysical' '#print axioms CoThetaWholeBase.theta_first_complement_twelve' '#print axioms CoThetaWholeBase.CertifiedData.lower_0' '#print axioms CoThetaWholeBase.CertifiedData.lower_2' '#print axioms CoThetaWholeBase.CertifiedData.lower_3' > "$RUNNER_TEMP/FullAudit.lean"
          lake env lean "$RUNNER_TEMP/FullAudit.lean"
