name: Signed readers of a Petersen circuit
on:
  push:
    branches: [co-signed-reader-2598-1235]
permissions:
  contents: read
jobs:
  lean:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Fetch this exact public commit
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q project
          git -C project fetch -q --depth=1 --no-tags https://github.com/brilliant-hq/pequalnp-proofs.git b7fda94310e5fb9dbef1e669f33b26bd63ea42ea
          git -C project checkout -q --detach FETCH_HEAD
          cp research/Co*.lean project/lean/PEqualNP/
      - name: Install pinned Lean
        working-directory: project/lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
      - name: Build the research file with the pinned Mathlib
        working-directory: project/lean
        run: |
          lake exe cache get Mathlib
          lake build +PEqualNP.CoPetersen2598Reader
      - name: Check the complete physical result and audit its axioms
        working-directory: project/lean
        run: |
          timeout 1200 lake env lean -o .lake/build/lib/lean/PEqualNP/CoPetersen2598Closed.olean PEqualNP/CoPetersen2598Closed.lean
          printf '%s\n' 'import PEqualNP.CoPetersen2598Closed' '#print axioms CoPetersen2598.direct_reader_limit' '#print axioms CoPetersen2598.cofactor_limit' > "$RUNNER_TEMP/Audit.lean"
          lake env lean "$RUNNER_TEMP/Audit.lean" > "$RUNNER_TEMP/Audit.txt"
          cat "$RUNNER_TEMP/Audit.txt"
          python3 ../../research/theta-check-axioms.py "$RUNNER_TEMP/Audit.txt" CoPetersen2598.direct_reader_limit
          python3 ../../research/theta-check-axioms.py "$RUNNER_TEMP/Audit.txt" CoPetersen2598.cofactor_limit
