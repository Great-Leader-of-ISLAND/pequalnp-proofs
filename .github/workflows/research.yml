name: Partial plane single-bypass and multi-output search
on:
  push:
    branches: [co-triangle-window-refined-1007]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Fetch the research program and certificate checker
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Verify controls and search limited windows
        working-directory: research
        run: |
          cd "$RUNNER_TEMP"
          apt-get download cadical
          dpkg-deb -x cadical_*.deb solver
          cd "$GITHUB_WORKSPACE/research"
          python3 -B project_windows_refined.py "$RUNNER_TEMP/solver/usr/bin/cadical" 70
