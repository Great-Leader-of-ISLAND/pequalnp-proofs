name: Check the two real DAG nodes and the new restrictions
on:
  push:
    branches: [co-p2-slices-and-sparse-2315]
permissions:
  contents: read
jobs:
  lean:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Fetch this exact public commit
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q project
          git -C project fetch -q --depth=1 --no-tags https://github.com/open-goat/pequalnp-proofs.git 81e5465e8c2b4c3669bab9d44f1580b10d63ce47
          git -C project checkout -q --detach FETCH_HEAD
          cp research/Co*.lean project/lean/PEqualNP/
      - name: Install pinned Lean
        working-directory: project/lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
      - name: Restore the pinned Mathlib
        working-directory: project/lean
        timeout-minutes: 7
        run: lake exe cache get Mathlib
      - name: Generate both full roots from canonical gates and the upstream statement
        id: assemble
        working-directory: research
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/cert"
          mkdir "$cert"
          curl -fsSL --compressed --retry 2 --max-time 40 --max-filesize 33554432 https://data.pequalnp.com/data/desk/gaps.json -o "$RUNNER_TEMP/catalog.json"
          c++ -std=c++17 -O3 4482-junction-export.cpp -o "$RUNNER_TEMP/emit"
          for k in 0 1; do
            prefix="$RUNNER_TEMP/g$k"
            "$RUNNER_TEMP/emit" "$k" "$prefix.tsv"
            python3 4482-junction-audit.py "$prefix.tsv.graph" --binary "$prefix.bin"
            python3 4482-junction-fixed.py "$prefix.bin" "$cert/CoJunctionArchive$k.lean"
            python3 4482-junction-complete.py "$prefix.tsv" "$prefix.bin" "CoJunctionArchive$k" "$cert/CoWholeRoot$k.lean" --chunk 128
            python3 4482-junction-complete.py "$prefix.tsv" "$prefix.bin" "CoJunctionArchive$k" "$cert/CoActualFirst$k.lean" --start 0 --count 1
            python3 4482-junction-complete.py "$prefix.tsv" "$prefix.bin" "CoJunctionArchive$k" "$cert/CoActualLeaf$k.lean" --first-leaf
          done
          cp "$cert"/Co*.lean "$GITHUB_WORKSPACE/project/lean/PEqualNP/"
          ls -l "$cert"/CoActual*.lean

      - name: Run exact replay of the eight vertex candidates
        working-directory: research
        timeout-minutes: 6
        run: |
          set -euo pipefail
          c++ -O3 -std=c++17 1677-seeded-eight-witness.cpp -o "$RUNNER_TEMP/seed"
          python3 1677-refinements.py "$RUNNER_TEMP/seed"
      - name: Verify CoJunctionComplete4482
        if: always()
        working-directory: project/lean
        timeout-minutes: 8
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 410 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoJunctionComplete4482"
      - name: Verify CoActualFirst0
        if: always()
        working-directory: project/lean
        timeout-minutes: 8
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 410 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoActualFirst0"
      - name: Verify CoActualLeaf0
        if: always()
        working-directory: project/lean
        timeout-minutes: 8
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 410 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoActualLeaf0"
      - name: Verify Co1677ThreeAnd
        if: always()
        working-directory: project/lean
        timeout-minutes: 8
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 410 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co1677ThreeAnd"
      - name: Verify Co1677Or26
        if: always()
        working-directory: project/lean
        timeout-minutes: 8
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 410 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co1677Or26"
      - name: Verify Co5339Converse
        if: always()
        working-directory: project/lean
        timeout-minutes: 8
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=9G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 410 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co5339Converse"
