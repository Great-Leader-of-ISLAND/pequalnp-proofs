name: Theta bounded kernel probes
on:
  push:
    branches: [co-theta1924-calibrate-0933]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Fetch only the public mathematical sources
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Check the straight-line normalization and live-set extraction
        run: |
          set -euo pipefail
          curl -fsSL --max-time 90 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.36.0
          src="$GITHUB_WORKSPACE/research"
          python3 -B "$src/theta1924probes.py" --output "$RUNNER_TEMP/probes.txt"
          cd "$RUNNER_TEMP"
          cat "$src/CoThetaFreeInstance.lean" probes.txt > Bench.lean
          timeout -k 3s 90s lean +leanprover/lean4:v4.36.0 -M 1800 -o Bench.olean Bench.lean
          export LEAN_PATH="$RUNNER_TEMP"
          export LEAN_NUM_THREADS=1
          lean +leanprover/lean4:v4.36.0 --help | sed -n '1,43p'
          affinity=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          for mode in baseline rfl4 decide4 rfl5 runtime; do
            echo 'import Bench' > Check.lean
            echo 'open CoThetaBits' >> Check.lean
            echo 'set_option maxHeartbeats 0' >> Check.lean
            echo 'set_option maxRecDepth 4000' >> Check.lean
            case "$mode" in
              baseline) echo 'theorem checked : certifiedSearch 0 probe4 = false := rfl' >> Check.lean ;;
              rfl4) echo 'theorem checked : certifiedSearch 4 probe4 = false := rfl' >> Check.lean ;;
              decide4) echo 'theorem checked : certifiedSearch 4 probe4 = false := by decide +kernel' >> Check.lean ;;
              rfl5) echo 'theorem checked : certifiedSearch 5 probe5 = false := rfl' >> Check.lean ;;
              runtime) echo '#eval certifiedSearch 4 probe4' >> Check.lean ;;
            esac
            if test "$mode" != runtime; then echo '#print axioms checked' >> Check.lean; fi
            set +e
            timeout -k 3s 25s /usr/bin/time -f 'seconds=%e rss_kib=%M' taskset -c "$affinity" lean +leanprover/lean4:v4.36.0 -j 1 -s 2048 -M 850 Check.lean > "mode-$mode.log" 2>&1
            status=$?
            set -e
            echo "mode=$mode status=$status"
            tail -8 "mode-$mode.log"
          done
