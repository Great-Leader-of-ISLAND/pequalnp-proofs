name: Check physical OR lower bound and graph cut proofs
on:
  push:
    branches: [co-p2-projections-1452]
permissions:
  contents: read
jobs:
  lean:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Fetch this exact public commit
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q project
          git -C project fetch -q --depth=1 --no-tags https://github.com/open-goat/pequalnp-proofs.git 048b39bb2c5b2c21da06d44218d16366086a68d9
          git -C project checkout -q --detach FETCH_HEAD
          cp research/Co*.lean project/lean/PEqualNP/
      - name: Install pinned Lean
        working-directory: project/lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
      - name: Build the research file with the pinned Mathlib
        working-directory: project/lean
        run: |
          lake exe cache get Mathlib
          failed=0
          for module in Co1593SafeBound CoGenericArcs2147 CoHead3024 CoStar3456 CoAO3143Physical CoAO3143SmallProbeData CoSliceCore3143; do
            timeout 320 lake build "+PEqualNP.$module" || failed=1
          done
          exit "$failed"
      - name: Verify a real interval in the compressed finite certificate
        if: always()
        timeout-minutes: 2
        working-directory: project/lean
        run: |
          if [ ! -e .lake/build/lib/lean/PEqualNP/CoAO3143SmallProbeData.olean ]; then echo "Probe module dependency unavailable"; exit 0; fi
          printf '%s\n' 'import PEqualNP.CoAO3143SmallProbeData' 'open CoAO3143.Memo' 'set_option maxHeartbeats 0' 'set_option maxRecDepth 16384' 'example : allAt testSmall6 0 1=true := by decide +kernel' > "$RUNNER_TEMP/Probe.lean"
          timeout 70 /usr/bin/time -f 'small_node_kernel_seconds=%e' lake env lean "$RUNNER_TEMP/Probe.lean"
      - name: Test exact seeded nine-vertex search with graph pruning
        if: always()
        timeout-minutes: 3
        run: |
          set -eu
          c++ -std=c++17 -O2 research/3024-pruned.cpp -o "$RUNNER_TEMP/nine"
          "$RUNNER_TEMP/nine" 0 0 3 15 2 control
          for pivot in -1 0 1 3 4 6 7 9; do
            rc=0
            "$RUNNER_TEMP/nine" "$pivot" 0 2 13 10 -1 || rc=$?
            echo "pivot $pivot exit $rc"
          done
