        timeout-minutes: 7
        run: |
          sudo systemd-run --scope --quiet --collect -p MemoryMax=8G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 300 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co4358OrbitProfile"
      - name: Verify Co1675ShardFour
        if: always() && steps.commutes.outcome == 'success'
        working-directory: project/lean
        timeout-minutes: 41
        run: |
          sudo systemd-run --scope --quiet --collect -p MemoryMax=12G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 1150 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build +PEqualNP.Outside.L_meta_1668
          sudo systemd-run --scope --quiet --collect -p MemoryMax=12G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 1150 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build +PEqualNP.Outside.L_meta_1673
          sudo systemd-run --scope --quiet --collect -p MemoryMax=12G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 1150 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build +PEqualNP.Co1675ShardFour
