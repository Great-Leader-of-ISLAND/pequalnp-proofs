name: Seven-variable theta complete paired-row frontier
on:
  push:
    branches: [co-theta-kernel-0850]
permissions:
  contents: read
jobs:
  lean:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Fetch this exact public commit
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q project
          git -C project fetch -q --depth=1 --no-tags https://github.com/brilliant-hq/pequalnp-proofs.git cc7575339c58a3f0e2e855a13128e39ba904a1fc
          git -C project checkout -q --detach FETCH_HEAD
          cp research/CoTheta*.lean project/lean/PEqualNP/
      - name: Install pinned Lean
        working-directory: project/lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
      - name: Build the research file with the pinned Mathlib
        working-directory: project/lean
        run: |
          lake exe cache get Mathlib
          lake build +PEqualNP.CoThetaFast
          printf '%s\n' 'import PEqualNP.CoThetaFast' '#print axioms CoThetaFast.exclusion' > "$RUNNER_TEMP/Audit.lean"
          lake env lean "$RUNNER_TEMP/Audit.lean"
      - name: Type check wire permutation and physical first gate
        continue-on-error: true
        working-directory: project/lean
        run: |
          lake build +PEqualNP.CoThetaOrbit
      - name: Kernel decide whole signed orbit certificates
        working-directory: project/lean
        run: |
          for j in 0 2 3; do
            cat > "$RUNNER_TEMP/Kernel.lean" <<LEAN
          import PEqualNP.CoThetaFast
          set_option maxRecDepth 30000
          set_option maxHeartbeats 0
          theorem root$j : CoThetaFast.checkedRoot $j = true := by decide +kernel
          #print axioms root$j
          LEAN
            echo "Checking whole signed orbit $j"
            timeout 8m lake env lean "$RUNNER_TEMP/Kernel.lean" || { echo "Unresolved kernel computation $j"; exit 1; }
          done
