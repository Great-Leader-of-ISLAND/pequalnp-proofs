name: Theta formal backward extraction
on:
  push:
    branches: [co-theta1924-raw2-0949]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Fetch only the public mathematical sources
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Check the straight-line normalization and live-set extraction
        run: |
          set -euo pipefail
          curl -fsSL --max-time 90 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.36.0
          cp research/CoThetaNineReaders.lean "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.simulate_all_wires' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.rewind' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.Live.separates' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.Live.width_cover' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.theta_needs_every_input' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.restrict_trace' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.trace_of_free' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.two_zero_propagate' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.trace_barrier' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.second_reader' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.trace_minimal_fresh' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.fresh_outputs' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaFreeCore.two_joint_readers_impossible' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaNine.third_joint_reader' >> "$RUNNER_TEMP/Extract.lean"
          echo '#print axioms CoThetaNine.another_raw_reader' >> "$RUNNER_TEMP/Extract.lean"
          lean +leanprover/lean4:v4.36.0 "$RUNNER_TEMP/Extract.lean"
