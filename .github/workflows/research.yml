name: Verify the projective-plane unfolding reduction
on:
  push:
    branches: ['co-p2-1963-reduction-audit']
permissions: {}
jobs:
  lean:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.fork == true && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 83
    env:
      LEAN_NUM_THREADS: '2'
      BASE: 'fd4161c0cb604d78e1056fe7f69a1b68e83063ff'
      CANDIDATE_BRANCH: 'R-meta-1963-368'
      GAP: 'L-meta-1963'
      FILE: 'lean/PEqualNP/Outside/R_meta_1963_368.lean'
    steps:
      - name: Check out the pinned public upstream base and snapshot its public desk statement
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --no-tags --depth=1 'https://github.com/open-goat/pequalnp-proofs.git' "$BASE"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASE"
          mkdir -p "$RUNNER_TEMP/in"
          curl -fsS --retry 2 --max-time 45 --max-filesize 16777216 -o "$RUNNER_TEMP/in/gaps.json" https://data.pequalnp.com/data/desk/gaps.json
          node .github/scripts/outside-guard.mjs gap "$RUNNER_TEMP/in/gaps.json" "$GAP" "$FILE" "$RUNNER_TEMP/in" reduce
          echo '2c8e7cdf8bf248bd284b355afc81c3fbc5a37db9db27bf39cbbec20440e57ea2  '"$RUNNER_TEMP/in/statement.txt" | sha256sum -c -
          echo '086c15d1b559b2a2d009b0769f0c99c6115b689366849c1f05591d4b44c7abc1  '"$RUNNER_TEMP/in/imports.json" | sha256sum -c -
          node .github/scripts/outside-guard.mjs closure "$PWD" "$RUNNER_TEMP/in/imports.json" "$FILE" "$RUNNER_TEMP/in" reduce
      - name: Install pinned Lean and prepare Mathlib, definitions and the checker
        working-directory: lean
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 90 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake exe cache get Mathlib
          targets=(checklemma +PEqualNP.Defs)
          while IFS= read -r m; do if [[ -n "$m" ]]; then targets+=("+$m"); fi; done < "$RUNNER_TEMP/in/base-imports.txt"
          lake build "${targets[@]}"
      - name: Wait for the candidate then read exactly one new file on the expected parent
        run: |
          set -euo pipefail
          fork='https://github.com/Great-Leader-of-ISLAND/pequalnp-proofs.git'
          ref="refs/heads/$CANDIDATE_BRANCH"
          deadline=$((SECONDS + 60 * 18))
          while :; do
            if result=$(timeout 15s git ls-remote --exit-code "$fork" "$ref"); then break; fi
            if (( SECONDS >= deadline )); then echo 'Candidate unavailable within time limit'; exit 1; fi
            sleep 10
          done
          read -r sha actual <<< "$result"
          [[ "$actual" = "$ref" && "$sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q --no-tags --depth=2 "$fork" "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          test "$(git show -s --format=%P "$sha")" = "$BASE"
          printf 'A\0%s\0' "$FILE" > "$RUNNER_TEMP/expected"
          git diff-tree --no-commit-id -r --no-renames --name-status -z "$BASE" "$sha" > "$RUNNER_TEMP/actual"
          cmp "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test "$(git ls-tree "$sha" -- "$FILE" | cut -d' ' -f1,2)" = "100644 blob"
          test "$(git cat-file -s "$sha:$FILE")" -le 524288
          test ! -e "$FILE" && test ! -L "$FILE"
          git cat-file blob "$sha:$FILE" > "$FILE"
          node .github/scripts/outside-guard.mjs imports "$FILE" "$RUNNER_TEMP/in/imports.json" "$FILE" reduce
          echo "Verifying $sha against upstream parent $BASE"
      - name: Compile and audit against the posted statement with the upstream verifier
        timeout-minutes: 48
        run: |
          set -euo pipefail
          # No runner credential is passed to Lean. The candidate is the only added source.
          # This fork result is advisory. The desk runs its own authoritative check.
          mkdir -p "$RUNNER_TEMP/co-queue"
          threads=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          # checklemma may need swap when all of Mathlib is imported. Use only space
          # on this disposable VM, preserving at least 6 GiB for later build output.
          disk=$(df -Pm / /mnt 2>/dev/null | awk 'NR>1 {print $4,$6}' | sort -nr | head -1)
          read -r free mount <<< "$disk"
          mb=$((free - 6144))
          if (( mb > 12288 )); then mb=12288; fi
          if (( mb >= 1024 )); then
            swap="${mount%/}/co-verifier-swap"
            sudo install -m 0600 /dev/null "$swap"
            sudo fallocate -l "${mb}M" "$swap"
            sudo mkswap -q "$swap" && sudo swapon "$swap"
          fi
          mem=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
          old=$((mem - 1572864)); if (( old > 6815744 )); then old=6815744; fi
          cap=$((mem - 3145728)); if (( cap < old )); then cap=$old; fi
          deps=$(awk 'NF{n++} END{print n+0}' "$RUNNER_TEMP/in/outside-imports.txt")
          limit=$((1200 + 240 * deps)); if (( limit > 2700 )); then limit=2700; fi
          sudo systemd-run --quiet --scope --collect -p "MemoryMax=${cap}K" unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs \
            env -i HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 PEQUALNP_HOME="$RUNNER_TEMP/co-queue" \
            taskset -c "$threads" timeout --kill-after=15s "$limit" /usr/bin/time -f "cold_seconds=%e rss_kib=%M" node tools/check-lean.mjs "$FILE" "$RUNNER_TEMP/in/statement.txt" reduce
      - name: Fetch further independent circuit test modules after the reduction check
        if: always()
        run: |
          git init -q "$RUNNER_TEMP/related"
          git -C "$RUNNER_TEMP/related" fetch -q --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/related" checkout -q --detach FETCH_HEAD
          cp "$RUNNER_TEMP"/related/research/Co*.lean lean/PEqualNP/
          c++ -std=c++17 -O2 "$RUNNER_TEMP/related/research/4482-frontier.cpp" -o "$RUNNER_TEMP/allports"
      - name: Check unrestricted nine-input cut roots
        if: always()
        timeout-minutes: 3
        run: |
          for seed in 0 1; do
            sudo systemd-run --scope --quiet --collect -p MemoryMax=2G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups timeout --kill-after=2s 65s "$RUNNER_TEMP/allports" 511 "$seed" 7 500000 55 0
          done
      - name: Verify Co4358RectBench
        if: always()
        working-directory: lean
        timeout-minutes: 7
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=8G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 295 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co4358RectBench"
      - name: Verify Co4358RectTime
        if: always()
        working-directory: lean
        timeout-minutes: 7
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=8G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 295 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co4358RectTime"
      - name: Verify Co4358Join
        if: always()
        working-directory: lean
        timeout-minutes: 7
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=8G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 295 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.Co4358Join"
      - name: Verify CoPortTrace4482
        if: always()
        working-directory: lean
        timeout-minutes: 7
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=8G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 295 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoPortTrace4482"
      - name: Verify CoPortProbe4482
        if: always()
        working-directory: lean
        timeout-minutes: 7
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=8G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 295 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoPortProbe4482"
      - name: Verify CoTwoPortSlice4482
        if: always()
        working-directory: lean
        timeout-minutes: 7
        run: sudo systemd-run --scope --quiet --collect -p MemoryMax=8G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" LEAN_NUM_THREADS=2 timeout --kill-after=10s 295 /usr/bin/time -f 'module_seconds=%e rss_kib=%M' lake build "+PEqualNP.CoTwoPortSlice4482"
