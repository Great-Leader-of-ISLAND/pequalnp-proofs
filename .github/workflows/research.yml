name: Seven-variable theta complete paired-row frontier
on:
  push:
    branches: [co-theta-packed-0956]
permissions:
  contents: read
jobs:
  lean:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Fetch this exact public commit
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q project
          git -C project fetch -q --depth=1 --no-tags https://github.com/brilliant-hq/pequalnp-proofs.git cc7575339c58a3f0e2e855a13128e39ba904a1fc
          git -C project checkout -q --detach FETCH_HEAD
          cp research/CoTheta*.lean project/lean/PEqualNP/
      - name: Generate the exact mixed-certificate diagram and both proof sources
        run: |
          python3 research/theta-witness-dag.py --expand-tree --signatures research/CoThetaWholeBase.lean --output "$RUNNER_TEMP/table.json" --seconds 150
          python3 research/render-theta-whole.py "$RUNNER_TEMP/table.json" research/CoThetaWholeBase.lean project/lean/PEqualNP/CoThetaPackedSamples.lean --samples 1 --index
          python3 research/render-theta-whole.py "$RUNNER_TEMP/table.json" research/CoThetaWholeBase.lean project/lean/PEqualNP/CoThetaPackedFull.lean --block 16
      - name: Install pinned Lean
        working-directory: project/lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
      - name: Verify semantics of the entire certificate language
        working-directory: project/lean
        run: |
          lake exe cache get Mathlib
          lake build +PEqualNP.CoThetaWholeBase
          printf '%s\n' 'import PEqualNP.CoThetaWholeBase' '#print axioms CoThetaWholeBase.nodeTest_sound' > "$RUNNER_TEMP/Audit.lean"
          lake env lean "$RUNNER_TEMP/Audit.lean"
          lake build +PEqualNP.CoThetaWholeOrbit
      - name: Verify one example of each certificate and all three root tables
        working-directory: project/lean
        run: lake build +PEqualNP.CoThetaPackedSamples
      - name: Verify the full subproblem
        working-directory: project/lean
        run: |
          lake build +PEqualNP.CoThetaPackedFull
          printf '%s\n' 'import PEqualNP.CoThetaPackedFull' '#print axioms CoThetaWholeBase.CertifiedData.lower_0' '#print axioms CoThetaWholeBase.CertifiedData.lower_2' '#print axioms CoThetaWholeBase.CertifiedData.lower_3' > "$RUNNER_TEMP/FullAudit.lean"
          lake env lean "$RUNNER_TEMP/FullAudit.lean"
