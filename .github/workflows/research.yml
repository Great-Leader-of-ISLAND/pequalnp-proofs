name: Exact seven-gate repair windows for L-meta-4087
on:
  push:
    branches: [co-p2-bounded-port-search-1849]
permissions:
  contents: read
jobs:
  solve:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Fetch research commit
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Prepare portable SAT solver and explicit seed
        run: |
          if ! command -v cadical; then
            sudo apt-get -qq update -o Acquire::Retries=1
            sudo apt-get -qq install -y --no-install-recommends cadical
          fi
          cadical --version
          cat > research/4087-mixed-near-18.json <<'SEED'
          {"centers": [[false, 0], [true, 2], [true, 3], [true, 5], [true, 6], [true, 7], [true, 8], [true, 9], [true, 11]], "rot": [0, 0, 0, 0, 0, 0, 0, 0, 0], "gates": [[0, 5, 4], [0, 70, 7], [1, 17, 71], [0, 10, 11], [1, 23, 73], [0, 1, 9], [0, 75, 3], [1, 13, 76], [0, 12, 8], [0, 78, 2], [1, 25, 79], [0, 1, 4], [0, 81, 10], [1, 14, 82], [0, 74, 80], [0, 83, 77], [0, 85, 72], [0, 84, 86]], "missing": [4, 10], "negative_errors": 0}
          SEED
          python3 research/4087-mixed-cegis.py --self-test
      - name: Check six seven-gate windows
        timeout-minutes: 2
        run: |
          sudo systemd-run --scope --quiet --collect -p MemoryMax=3G setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env HOME="$HOME" PATH="$PATH" timeout -k 2s 90s python3 research/4087-mixed-cegis.py --seconds 84 --directory "$RUNNER_TEMP/pg4087repair"
      - name: Record bounded public replay state
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/pg4087repair" <<'PYRESULT'
          import json,pathlib,sys
          d=pathlib.Path(sys.argv[1])
          for name in ('progress','witness'):
              p=d/(name+'.json')
              if p.is_file() and p.stat().st_size<=45000:
                  print('PORT4087_'+name+' '+json.dumps(json.loads(p.read_bytes()),separators=(',',':')))
          PYRESULT
