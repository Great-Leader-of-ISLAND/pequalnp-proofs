name: Adjacent OR seeds for the seven-input theta circuit
on:
  push:
    branches: [co-phase2-seed-breadth-1318]
permissions: {}
jobs:
  search:
    if: github.repository == 'Great-Leader-of-ISLAND/pequalnp-proofs' && github.event.repository.fork == true && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check the planted control and bound both searches
        run: |
          git init -q
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          python research/CoSeedTopological.py
